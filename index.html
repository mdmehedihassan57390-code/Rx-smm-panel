<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AmarBoost - New Order</title>
  <link rel="stylesheet" href="https://storage.perfectcdn.com/ry76oy/3y48j3l5p76m0dnm.css">
  <link rel="stylesheet" href="https://storage.perfectcdn.com/ry76oy/98d2r3l22kbg7o6x.css">
</head>
<body class="body">
  <div class="wrapper-content">
    <div class="container my-5">
      <div class="card p-4">
        <h4 class="mb-4">New Order</h4>
        <form id="orderForm">
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-control" id="orderform-category">
              <option value="1">Instagram Followers</option>
              <option value="2">Facebook Likes</option>
              <option value="3">YouTube Views & Watchtime</option>
              <option value="4">TikTok Followers & Likes</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Service</label>
            <select class="form-control" id="orderform-service"></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Link</label>
            <input class="form-control" type="text" id="field-link" placeholder="https://" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input class="form-control" type="number" id="field-quantity" placeholder="1000" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Charge</label>
            <input class="form-control" type="text" id="charge" value="$0.00" disabled>
          </div>
          <button type="submit" id="submitBtn" class="btn btn-primary w-100">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const servicesData = {
      "1": [{ id: "101", name: "101 - Instagram Non-Drop Followers", rate: 1.50 }],
      "2": [{ id: "103", name: "103 - Facebook Page Likes & Followers", rate: 2.20 }],
      "3": [{ id: "104", name: "104 - YouTube High Retention Views", rate: 3.00 }],
      "4": [{ id: "105", name: "105 - TikTok Real Followers", rate: 1.20 }]
    };

    const catSel = document.getElementById('orderform-category');
    const serSel = document.getElementById('orderform-service');
    const qtyInp = document.getElementById('field-quantity');
    const chgInp = document.getElementById('charge');

    function updateServices() {
      const services = servicesData[catSel.value] || [];
      serSel.innerHTML = '';
      services.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.setAttribute('data-rate', s.rate);
        opt.textContent = `${s.name} - $${s.rate}/1K`;
        serSel.appendChild(opt);
      });
      calcCharge();
    }

    function calcCharge() {
      const opt = serSel.options[serSel.selectedIndex];
      const rate = opt ? parseFloat(opt.getAttribute('data-rate')) : 0;
      const qty = parseInt(qtyInp.value) || 0;
      chgInp.value = `$${((qty / 1000) * rate).toFixed(2)}`;
    }

    catSel.addEventListener('change', updateServices);
    serSel.addEventListener('change', calcCharge);
    qtyInp.addEventListener('input', calcCharge);
    updateServices();

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Processing...';

      try {
        const res = await fetch('/api/place-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            service: serSel.value,
            link: document.getElementById('field-link').value,
            quantity: qtyInp.value
          })
        });
        const data = await res.json();
        if (data.order) {
          alert(`অর্ডার সফল হয়েছে! Order ID: ${data.order}`);
        } else {
          alert(`রেসপন্স: ${JSON.stringify(data)}`);
        }
      } catch (err) {
        alert('সার্ভার এরর');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Submit';
      }
    });
  </script>
</body>
</html>
